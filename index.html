<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      The @font-face rules live in the Emotion theme (src/theme/components.js) and
      are therefore only emitted once ~185 kB of JS has parsed and React has
      rendered. Without these two lines the hero h1 paints in Times New Roman and
      then swaps to Cinzel. Preload only the two above-the-fold faces (display h1
      + body); the remaining three are found by normal discovery.
    -->
    <link rel="preload" href="/fonts/cinzel-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />

    <title>Max Masarski — Gameplay Programmer (Unreal Engine 5)</title>
    <meta
      name="description"
      content="Portfolio of Max Masarski, a gameplay programmer specializing in melee combat, AI behavior, and modular ability systems in Unreal Engine 5. Featuring Pray For Plagues, a Souls-borne action RPG prototype."
    />
    <!--
      LIVE DOMAIN: the site is served from the GitHub Pages user site at
      https://sleepyreapervk.github.io/ (domain root, so the root-absolute
      asset paths throughout the build resolve as-is). One constant, repeated
      across the tags in this block. Keep in sync with SITE_ORIGIN in
      src/components/common/Seo.jsx. If a custom domain is added later, both
      have to change together.
    -->
    <link rel="canonical" href="https://sleepyreapervk.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Max Masarski — Gameplay Programmer (Unreal Engine 5)" />
    <meta
      property="og:description"
      content="Portfolio of Max Masarski, a gameplay programmer specializing in melee combat, AI behavior, and modular ability systems in Unreal Engine 5. Featuring Pray For Plagues, a Souls-borne action RPG prototype."
    />
    <meta property="og:image" content="https://sleepyreapervk.github.io/media/og-cover.jpg" />
    <meta property="og:url" content="https://sleepyreapervk.github.io/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
