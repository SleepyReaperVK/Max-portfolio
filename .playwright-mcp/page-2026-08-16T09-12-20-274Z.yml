                - generic [ref=f18e140]: Pray For Plagues — Action RPG Souls-Borne Prototype
                - generic [ref=f18e146]: This project is a Souls‑borne inspired action RPG built around deliberate combat, punishing enemy encounters, and systemic gameplay interactions. The goal is to recreate the core pillars of the genre weighty animations, precise timing windows, readable telegraphs, and intelligent enemy behavior, while building the underlying systems in a clean, extensible engineering architecture.
                - generic [ref=f18e152]: The game is developed in Unreal Engine 5, using a combination of C++, Blueprints and Blender, where its foundation is heavily built around GAS and its attribute system.
