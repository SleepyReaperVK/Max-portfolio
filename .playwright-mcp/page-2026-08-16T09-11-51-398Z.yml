                        - generic [ref=f16e154]:
                          - generic [ref=f16e155]: At the core of the system is the Weapon Framework, which assigns each weapon its own animation layer and moveset. Light and heavy attack chains are defined through data assets that specify animation sequences, combo routing, damage values, and special attack cooldowns. This allows new weapons and movesets to be added without modifying core combat logic.
                          - generic [ref=f16e164]:
                            - generic [ref=f16e165]: Attack execution is fully synchronized with animation events. Hitboxes are spawned at specific frames, combo counters are updated based on animation state transitions, and parry windows are defined through event markers that ensure consistent timing across all weapons. The system supports both standard and special attacks, each with unique multipliers and behavior rules.
