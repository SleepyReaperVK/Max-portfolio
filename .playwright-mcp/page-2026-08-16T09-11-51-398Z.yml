                              - figure [ref=f16e446]
                          - generic [ref=f16e452]: During this window, if an enemy attack connects, the combat system checks whether the player currently holds the parry tag. If the tag is present, the incoming damage is completely negated, and the system transitions the player into a successful parry animation. This animation features distinct visual and audio feedback—reinforcing the impact and clarity of the mechanic—and overrides the standard hit reaction logic while also granting a counter-attack opportunity.
                    - generic [ref=f16e462]:
                      - button "Close" [disabled] [expanded] [ref=f16e464] [cursor=pointer]
                      - generic [ref=f16e467]:
                        - heading "Weapon Framework" [level=4] [ref=f16e469]
                        - generic [ref=f16e471]:
                          - generic [ref=f16e472]: The weapon framework is built around a data‑driven architecture that allows each weapon to define its own behavior, moveset, and gameplay identity without requiring changes to core combat logic. All weapon data is stored in a centralized UDataTable, which manages every item in the game. Weapons extend this structure with additional fields that define their combat functionality, animation behavior, and special abilities.
                          - figure [ref=f16e481]
                          - generic [ref=f16e487]: Each weapon entry contains its own Weapon Animation Layer, which determines the moveset the player uses when the weapon is equipped. This includes unique light and heavy attack chains, special attacks, dodge animations, and custom hit reaction montages. By assigning animation layers per weapon, the system ensures that switching weapons immediately updates the player’s entire combat profile.
                          - generic [ref=f16e493]: Weapons also define their Damage-Scalable-Float, allowing damage to scale dynamically based on player level or progression. This keeps balancing centralized and makes tuning weapon strength straightforward. Special abilities and weapon skills are also stored in the weapon’s data entry, enabling the framework to grant abilities automatically when the weapon is equipped.
                          - generic [ref=f16e499]: To support responsiveness and clarity, each weapon includes its own Mapping Context, which updates the player’s input profile when switching weapons. This allows different weapons to introduce unique control schemes or special attack inputs without affecting other weapons
                          - generic [ref=f16e505]: Cooldowns for weapon abilities are managed through a Curve-Table, which defines cooldown durations and scaling behavior. This keeps cooldown logic flexible and data‑driven, allowing designers to adjust ability pacing without modifying code.
                    - generic [ref=f16e515]:
                      - button "Close" [disabled] [expanded] [ref=f16e517] [cursor=pointer]
                      - generic [ref=f16e520]:
                        - heading "Lock On Target System" [level=4] [ref=f16e522]
                        - generic [ref=f16e524]:
                          - generic [ref=f16e525]: The lock‑on system provides the player with precise control over combat targeting, ensuring that attacks, movement, and camera behavior remain focused on a selected enemy. When activated, the system identifies the nearest valid target based on distance, angle, and visibility, then anchors the camera and player orientation toward that enemy.
                          - generic [ref=f16e531]: Lock‑on directly integrates with the combat framework. Attack direction, hitbox alignment, and the 4‑direction hit reaction system all use the locked target as a reference point, ensuring consistent and readable combat behavior. The system also supports dynamic target switching, allowing the player to cycle between nearby enemies during multi‑target encounters. Additionally when an enemy is defeated the lock on will switch to the next nearby target.
