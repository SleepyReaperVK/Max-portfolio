                  - heading "Design Goals" [level=3] [ref=f16e100]
                  - generic [ref=f16e102]:
                    - generic [ref=f16e103]: "The combat system is built around core design goals inspired by Souls‑borne combat philosophy: deliberate actions, readable enemy intent, and punishing-but-fair encounters. Every mechanic—from attack chains to parry windows—is designed to reinforce clarity, weight, and player mastery."
                    - generic [ref=f16e109]: Combat must feel committed, attacks have meaningful recovery, timing matters, and players are rewarded for understanding spacing, telegraphs, and combo flow. Weapon identity is central to the experience, so each weapon has a unique moveset, animation layer, and damage profile that supports different playstyles.
                    - generic [ref=f16e115]: Enemy behavior and player feedback are tightly integrated. Telegraphs must be readable, parryable attacks must follow consistent rules, and hit reactions must communicate impact clearly without disrupting combat flow. The system prioritizes responsiveness, consistency, and scalability, so new weapons, attacks, and enemy behaviors can be added without rewriting core logic.
                    - generic [ref=f16e121]: These goals guide every architectural decision in the combat system, shaping how attacks are animated, how damage is calculated, and how players read danger and opportunity during encounters.
