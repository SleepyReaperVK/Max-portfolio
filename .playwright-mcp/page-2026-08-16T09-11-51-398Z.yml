                        - heading "Hitbox & Hurtbox System" [level=4] [ref=f16e354]
                        - generic [ref=f16e356]:
                          - generic [ref=f16e357]: The hitbox and hurtbox system is built around a precise, animation‑driven collision workflow that ensures attacks feel fair, consistent, and tightly synchronized with weapon motion. The system uses weapon‑based hitboxes that interact with the target’s capsule collider, allowing for clean, predictable detection across both player and enemy characters. During an attack, the weapon’s hitbox is activated through an AnimNotifyState placed directly inside the attack montage. This notify defines the exact window in which the weapon can deal damage, ensuring that collision is only enabled during the correct animation frames. When the notify begins, the weapon’s hitbox becomes active; when it ends, collision is disabled again. This approach guarantees that timing, spacing, and animation readability remain consistent across all weapons and movesets. When the hitbox overlaps a capsule, the system performs a hostility check to determine whether the target is a valid enemy or player. If the target is hostile, the damage pipeline is triggered, applying the appropriate values based on weapon type, combo count, and special attack modifiers.
