                        - heading "Parry System" [level=4] [ref=f16e420]
                        - generic [ref=f16e422]:
                          - generic [ref=f16e423]: The parry system is built around a timed, animation‑driven window that allows the player to negate incoming damage and immediately transition into a counterattack. The mechanic is designed to feel precise, rewarding, and consistent with Souls‑borne combat philosophy, where timing and commitment define success. When the player initiates a parry attempt, a dedicated parry animation is played. Inside this montage, a carefully placed parry window grants the player a temporary gameplay tag that marks them as “parry‑ready.” This tag represents the active parry state and ensures that the timing of the mechanic is fully synchronized with the animation frames.
                          - generic [ref=f16e433]:
                            - button "Close" [disabled] [expanded] [ref=f16e435] [cursor=pointer]
