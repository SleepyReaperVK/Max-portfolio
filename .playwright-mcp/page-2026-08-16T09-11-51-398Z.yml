                  - heading "Overview" [level=3] [ref=f16e68]
                  - generic [ref=f16e70]:
                    - generic [ref=f16e71]: The combat system is built around a Souls‑borne inspired, animation‑driven framework designed to deliver weighty attacks, precise timing windows, and clear player feedback. Each weapon features its own unique animation layer, complete with distinct light and heavy attack chains, special attacks with cooldowns, and combo‑based damage multipliers that reward commitment and mastery.
                    - generic [ref=f16e77]: "Combat interactions are fully systemic: hitboxes are synchronized with animation events, parryable attacks follow strict telegraph rules, and both player and enemies use a shared directional hit reaction system that reinforces impact and readability. The system is modular, data‑driven, and designed for scalability—new weapons, movesets, and attack behaviors can be added without modifying core logic."
                    - generic [ref=f16e83]: This page breaks down the architecture, design goals, implementation details, and engineering decisions behind the combat system, supported by GIFs demonstrating attack chains, parries and hit reactions in action.
              - generic [ref=f16e93]:
