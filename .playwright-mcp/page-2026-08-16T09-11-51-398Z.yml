                        - generic [ref=f16e631]:
                          - generic [ref=f16e632]: The Foot IK system ensures that the character’s feet align naturally with uneven terrain, improving grounding, stability, and animation fidelity during movement and combat. The system performs a downward trace from each foot to detect the slope or surface beneath the character, then adjusts the leg bones and pelvis position to match the terrain. This prevents foot sliding and floating, especially on angled or irregular surfaces.
