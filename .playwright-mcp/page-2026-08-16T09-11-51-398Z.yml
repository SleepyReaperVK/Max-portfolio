                          - generic [ref=f16e308]: The Hit Reaction System is integrated directly into the architecture. Both player and enemies use a shared directional reaction logic that determines impact direction and selects the appropriate animation. Bosses can selectively disable hit reactions through simple configuration flags, preserving their intended combat presence without altering the underlying system. Of course each player state has unique hit reaction animations.
                          - generic [ref=f16e314]: Bosses exclusively may have a weighted random chance of trigger a hit-reaction, for difficulty purposes. The setting can easily be adjusted within enemy’s GA.
