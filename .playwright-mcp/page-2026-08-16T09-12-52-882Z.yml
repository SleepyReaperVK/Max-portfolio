                    - generic [ref=f20e116]: "Featured Project:"
                    - generic [ref=f20e122]: Pray For Plagues— Action RPG Combat Prototype (UE5)
                    - generic [ref=f20e128]: A Souls-borne inspired dungeon exploration prototype featuring animation‑driven melee combat, reactive AI, and a modular ability system built in C++.
                    - generic [ref=f20e134]: "About Me:"
                    - generic [ref=f20e140]: Hello there! I’m Max, and I’m a gameplay programmer focused on building expressive, systemic action gameplay in Unreal Engine 5. I specialize in melee combat, AI behavior, animation‑driven mechanics, and modular ability systems — the kind of gameplay where every frame, hit, and reaction matters.
                    - generic [ref=f20e146]: This project was made entirely by myself. Ive started learning UE back in 2019 and in 2024 I’ve began developing this project. Ive always been passionate about gaming in general and my dream is to release my own title someday. I’m also very eager to join into a team that would support me and help me grow, learn and improve while giving my best to create something great together.
                    - generic [ref=f20e152]: If you’re building ambitious action gameplay and want someone who can take a mechanic from concept to polished implementation, count me in!
